name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python syntax
        run: python -m py_compile app.py
      - name: JavaScript syntax
        run: node --check static/app.js
      - name: Shell syntax
        run: bash -n install.sh update-live.sh
