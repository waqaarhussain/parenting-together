name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python syntax
        run: python -m py_compile app.py
      - name: JavaScript syntax
        run: node --check static/app.js && node --check static/vault.js && node --check static/qrcode.js
      - name: Shell syntax
        run: bash -n install.sh update-live.sh
      - name: Caddy configuration
        run: docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Two-parent feature flows
        run: python -m unittest discover -s tests -v
